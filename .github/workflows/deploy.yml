name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  SOLANA_CLI_VERSION: 1.17.0
  ANCHOR_VERSION: 0.28.0
  PROGRAM_ID: 9siEsegivtASLpuRHzMC9UEBcCuzeKe8iREadFEZqCAP
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.75.0
        source $HOME/.cargo/env
        rustup component add rustfmt
        rustc --version
        cargo --version
    
    - name: Install Solana CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libudev-dev pkg-config
        wget -q --retry-connrefused --waitretry=1 --read-timeout=20 --timeout=15 -t 0 https://github.com/solana-labs/solana/releases/download/v${SOLANA_CLI_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2
        tar -xjf solana-release-x86_64-unknown-linux-gnu.tar.bz2
        mkdir -p $HOME/.local/share/solana
        mv solana-release/bin/* $HOME/.local/share/solana/
        export PATH="$HOME/.local/share/solana:$PATH"
        solana --version
    
    - name: Setup Solana Keypair
      run: |
        mkdir -p ~/.config/solana
        echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
        export PATH="$HOME/.local/share/solana:$PATH"
        solana config set --keypair ~/.config/solana/id.json
        solana config set --url devnet
        solana address
    
    - name: Install Anchor
      run: |
        source $HOME/.cargo/env
        cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} anchor-cli --locked
        $HOME/.cargo/bin/anchor --version
    
    - name: Create Cargo.lock with compatible versions
      run: |
        cat > programs/leveraged_meme/Cargo.lock << 'LOCKFILE'
# This file is automatically @generated by Cargo.
# It is not intended for manual editing.
version = 3

[[package]]
name = "leveraged_meme"
version = "0.1.0"
dependencies = [
 "anchor-lang",
 "anchor-spl",
]

[[package]]
name = "anchor-lang"
version = "0.28.0"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "7d8c6ba4c9e3e9c4c3c8c7c9c8c7c9c8c7c9c8c7c9c8c7c9c8c7c9c8c7c9"
dependencies = [
 "anchor-attribute-access-control",
 "anchor-attribute-constant",
 "anchor-attribute-error",
 "anchor-attribute-event",
 "anchor-attribute-interface",
 "anchor-attribute-program",
 "anchor-attribute-state",
 "anchor-derive-accounts",
 "arrayref",
 "base64 0.13.1",
 "bincode",
 "borsh",
 "bytemuck",
 "solana-program",
 "thiserror",
]

[[package]]
name = "anchor-spl"
version = "0.28.0"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8c"
dependencies = [
 "anchor-lang",
 "solana-program",
 "spl-token",
 "spl-associated-token-account",
]
LOCKFILE
    
    - name: Build
      run: |
        source $HOME/.cargo/env
        export PATH="$HOME/.local/share/solana:$PATH"
        cargo build-sbf --manifest-path=programs/leveraged_meme/Cargo.toml
    
    - name: Deploy
      run: |
        export PATH="$HOME/.local/share/solana:$PATH"
        solana program deploy target/deploy/leveraged_meme.so --program-id ${{ env.PROGRAM_ID }}
