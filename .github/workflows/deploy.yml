name: Build and Deploy Solana Program

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SOLANA_CLI_VERSION: 1.18.26
  ANCHOR_VERSION: 0.28.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Solana CLI
        uses: actions/cache@v4
        id: cache-solana
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana
          key: solana-${{ env.SOLANA_CLI_VERSION }}

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${SOLANA_CLI_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Add Solana to PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Setup Solana Config
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.WALLET_PRIVATE_KEY }}' > ~/.config/solana/id.json
          solana config set --url devnet
          solana address

      - name: Check Balance
        run: solana balance

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} anchor-cli --locked

      - name: Build Program
        run: |
          cd program
          anchor build

      - name: Deploy Program
        id: deploy
        run: |
          cd program
          DEPLOY_OUTPUT=$(anchor deploy --provider.cluster devnet 2>&1)
          echo "$DEPLOY_OUTPUT"
          PROGRAM_ID=$(echo "$DEPLOY_OUTPUT" | grep -oP 'Program Id: \K[\w]+')
          echo "program_id=$PROGRAM_ID" >> $GITHUB_OUTPUT

      - name: Update Program ID in files
        run: |
          PROGRAM_ID="${{ steps.deploy.outputs.program_id }}"
          echo "New Program ID: $PROGRAM_ID"
          
          # Update Anchor.toml
          sed -i "s/leveraged_meme = \"[^\"]*\"/leveraged_meme = \"$PROGRAM_ID\"/" Anchor.toml
          
          # Update lib.rs
          sed -i "s/declare_id!(\"[^\"]*\")/declare_id!(\"$PROGRAM_ID\")/" program/src/lib.rs

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "deploy: update Program ID to ${{ steps.deploy.outputs.program_id }}"
          git push

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: program-build
          path: |
            program/target/deploy/*.so
            program/target/idl/*.json
            program/target/types/*.ts

      - name: Output Program ID
        run: |
          echo "========================================"
          echo "✅ DEPLOYMENT SUCCESSFUL!"
          echo "========================================"
          echo "Program ID: ${{ steps.deploy.outputs.program_id }}"
          echo "========================================"
